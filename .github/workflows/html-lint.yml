name: HTML Lint & Deploy

on:
  push:
    # Triggert bei jedem Push auf absolut jedem Branch
    branches: [ "**" ]
  pull_request:
    # Triggert auch bei Pull Requests gegen deine Haupt-Branches
    branches: [ "main", "master" ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 1. JOB: Testen (CI) - Läuft IMMER und auf JEDEM Branch
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Run HTMLHint
      run: npx htmlhint "**/*.html"

    # Artefakt wird immer hochgeladen, falls wir es später für den Deploy brauchen
    # Falls du 'main' statt 'master' nutzt, passe den GitHub-Referenz-Check unten an!
    - name: Upload Pages Artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.'

  # 2. JOB: Bereitstellen (CD) - Läuft NUR auf dem master-Branch nach erfolgreichem Linting
  deploy:
    needs: lint
    # Das 'if' sorgt dafür, dass dieser Job auf anderen Branches einfach übersprungen wird
    if: github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
