name: HTML Linter

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  htmlhint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run HTMLHint
      uses: htmlhint/htmlhint-action@v2
      with:
        addresses: './**/*.html'
